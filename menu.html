<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" type="text/css" href="css/style.css">

<body>
    <div id="menuwrapper">
        <header>
            <h1 id="h11">Kafé</h1>
            <img id="logga" src="img/logga.png" alt="kafeets logga">
            <h1 id="h12">Solglimt</h1>
        </header>

        <nav>
            <a href="index.html">Startsida</a>
            <a href="menu.html">Meny</a>
            <a href="about_us.html">Om oss</a>
        </nav>

        <section id="bakverk">
            <h2 class="menuhd">Bakverk</h2>
            <article class="gluten">
                <h3>Kanelbulle</h3>
                <p class="menutext">Pris</p>
                <img class="menuitem" src="img/kanelbulle.png" alt="en kanelbulle">
            </article>
            <article class="gluten">
                <h3>Croissant</h3>
                <p class="menutext">Info?</p>
                <img class="menuitem" src="img/croissant.png" alt="en croissant">
            </article>
        </section>

        <section id="dryck">
            <h2 class="menuhd">Dryck</h2>
            <article class="rest">
                <h3>Kaffe</h3>
                <p class="menutext">Info?</p>
                <img class="menuitem" src="img/coffee.png" alt="svart kaffe">
            </article>
            <article class="laktos">
                <h3>Latte</h3>
                <p class="menutext">Info?</p>
                <img class="menuitem" src="img/lattee.png" alt="latte">
            </article>
        </section>

        <section id="mat">
            <h2 class="menuhd">Småmat</h2>
            <article class="rest">
                <h3>Skagenmacka</h3>
                <p class="menutext">Info?</p>
                <img class="menuitem" src="img/skagenmacka.png" alt="en macka med skagenröra">
            </article>
            <article class="vegansk">
                <h3>Smörgåsbaugette</h3>
                <p class="menutext">Info?</p>
                <img class="menuitem" src="img/baguette.png" alt="en smörgårbaguette">
            </article>
        </section>

        <footer id="key">
    
            <ul>
                <p class="fthead">Ingrediensalternativ</p>
                <li id="gluten">Gluten</li>
                <li id="laktos">Laktos</li>
                <li id="vegansk">Vegansk</li>
            </ul>

            <article id="catering">
                <p class="fthead">Catering</p>
                <p>Tel: 035-773-2194</p>
                <p>Insta: Kafe_Solglimt</p>
            </article>

        </footer>
